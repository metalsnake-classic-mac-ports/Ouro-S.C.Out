[workspace]
resolver = "3"
members = ["crates/scout-core", "crates/scout-data", "crates/scout-original", "crates/scout"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/metalsnake-classic-mac-ports/Ouro-S.C.Out"
homepage = "https://metalsnake-classic-mac-ports.github.io/Ouro-S.C.Out/"

[workspace.dependencies]
scout-core = { path = "crates/scout-core" }
scout-data = { path = "crates/scout-data" }
thiserror = "2"
anyhow = "1"
sdl3 = "0.20"
