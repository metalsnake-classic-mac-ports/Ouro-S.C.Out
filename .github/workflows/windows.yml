# Builds the game for Windows (x64): one .exe with SDL3 and the data pack
# built in. On a version tag (pushed, or given when the workflow is started
# by hand) the zip goes to that tag's GitHub release; otherwise it is kept
# as a workflow artifact for testing.
name: windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (e.g. v0.2.0); empty = test build only
        required: false

permissions: {}

env:
  # the ouro-framework version this game version is built with (as in the
  # Homebrew formula); raise it together with the game's release
  FRAMEWORK_REF: v0.1.0
  CRATE: scout
  BINARY: ouro-scout

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # to attach the zip to the release
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the game
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: game
          persist-credentials: false

      - name: Check out ouro-framework next to it
        uses: actions/checkout@v4
        with:
          repository: metalsnake-classic-mac-ports/ouro-framework
          ref: ${{ env.FRAMEWORK_REF }}
          path: ouro-framework
          persist-credentials: false

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            game/target
          key: windows-cargo-${{ hashFiles('game/Cargo.lock') }}

      # SDL3 is built from source (needs CMake, which the runner has) and
      # linked statically. The C runtime stays a DLL: sdl3-sys builds SDL
      # against it (/MD), so +crt-static does not link. Its vcruntime DLLs
      # go next to the .exe instead (Microsoft's "app-local" deployment).
      - name: Build
        working-directory: game
        run: cargo build --release --locked -p "$CRATE" --features sdl3/build-from-source-static

      - name: Smoke test
        working-directory: game
        run: ./target/release/$BINARY.exe --version

      - name: List the DLLs it needs
        working-directory: game
        run: |
          python -m pip install --quiet pefile
          python -c "import pefile,sys; pe=pefile.PE(sys.argv[1]); print('\n'.join(sorted(e.dll.decode().lower() for e in pe.DIRECTORY_ENTRY_IMPORT)))" "target/release/$BINARY.exe" | tee dlls.txt

      - name: Pack
        working-directory: game
        run: |
          version=$(./target/release/$BINARY.exe --version | awk '{print $2}')
          name="$BINARY-$version-windows-x64"
          # the zip's name stays the same in every release, so the website
          # can link to .../releases/latest/download/<zip>
          mkdir "$name"
          cp "target/release/$BINARY.exe" README.md LICENSE CHANGELOG.md "$name/"
          # the Visual C++ runtime DLLs the .exe imports, from the installed
          # Visual Studio's redistributable folder (the UCRT is part of
          # Windows 10 and later)
          crt=$(ls -d "/c/Program Files/Microsoft Visual Studio"/*/*/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT | sort | tail -1)
          echo "runtime from: $crt"
          for dll in $(grep -E '^(vcruntime|msvcp)' dlls.txt); do
            cp "$crt/$dll" "$name/"
          done
          ls -l "$name"
          7z a "../$BINARY-windows-x64.zip" "$name" > /dev/null
          echo "ZIP=$BINARY-windows-x64.zip" >> "$GITHUB_ENV"

      - name: Keep as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY }}-windows-x64
          path: ${{ env.ZIP }}

      - name: Attach to the release
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # a new release gets the version's section of the changelog
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            awk -v head="## [${TAG#v}]" 'index($0, head) == 1 {f = 1; next} /^## \[/ {f = 0} f' game/CHANGELOG.md > notes.md
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" "$ZIP" -R "$GITHUB_REPOSITORY" --clobber
